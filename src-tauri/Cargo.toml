[package]
name = "awan"
version = "1.0.0"
description = "Awan: a minimal Pomodoro timer for Windows and Android"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "awan_lib"
# staticlib and cdylib are what the Android and iOS builds link against.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sync between devices: pairing key from the code, encrypted messages.
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.3"

[features]
# Test-only: opens WebView2's DevTools protocol on the port given in
# AWAN_DEVTOOLS_PORT so the CI smoke test can inspect the running UI.
# Never enabled in the released installer.
smoke-test = []

# Desktop only: a phone has no second instance to focus, no system-wide
# shortcuts and no startup entry.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
time = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Power",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
