<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: window, taskbar, Start menu, installer. Run `npm run icons` after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1764f"/>
      <stop offset="1" stop-color="#b0553a"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf5ee"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="318" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="128"/>
  <!-- 3/4 progress arc starting at 12 o'clock, clockwise -->
  <path d="M512 194 A318 318 0 1 1 194 512" fill="none" stroke="url(#arc)" stroke-width="128" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="62" fill="#ffffff"/>
</svg>
