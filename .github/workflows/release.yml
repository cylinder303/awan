name: Release

# Builds the Windows installer, checks that it installs and that the app
# starts, then attaches it to the GitHub release of the tag (creating the
# release if it does not exist yet). The Android APK, signed with the
# release key, is attached to the same release. Two ways to start it:
#   - push a version tag, for example v1.0.0;
#   - Actions -> Release -> Run workflow, with the tag. An existing tag is
#     rebuilt; a new one is created on the commit the workflow runs from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.0.0 (created if it does not exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the tag if it already exists
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the app version $VERSION. Run 'npm run version -- <x.y.z>', commit, then tag v<x.y.z>."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build

      - name: Keep a copy of the installer
        shell: bash
        run: |
          mkdir -p dist
          cp "src-tauri/target/release/bundle/nsis/Awan_${VERSION}_x64-setup.exe" dist/

      - name: Installer test
        shell: pwsh
        run: ./scripts/installer-test.ps1 "dist/Awan_${env:VERSION}_x64-setup.exe"

      - name: Build test binary
        working-directory: src-tauri
        run: cargo build --release --features smoke-test,tauri/custom-protocol

      - name: Smoke test
        run: |
          npm install --no-save playwright-core@1
          node scripts/smoke-test.mjs src-tauri/target/release/awan.exe smoke

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          FILE="dist/Awan_${VERSION}_x64-setup.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            # Creates the tag on the built commit when it does not exist yet.
            gh release create "$TAG" "$FILE" --target "$SHA" --title "Awan $TAG" --notes-file .github/release-notes.md
          fi

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: smoke
          if-no-files-found: ignore

  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The Windows job made sure the tag exists; build exactly that commit.
      - name: Check out the tag
        run: |
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign with the release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/android-sign.sh dist --release

      - name: Attach to the GitHub release
        run: gh release upload "$TAG" dist/*.apk --clobber
