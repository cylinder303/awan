name: CI

# Runs the tests and builds a Windows installer on every push, so each stage
# can be downloaded and tried from the run's "Artifacts" section.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: awan-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Launch the real app and check through WebView2's DevTools protocol
      # that the interface renders and talks to the native side.
      - name: Installer test (silent install, shortcuts, Installed apps, uninstall)
        shell: pwsh
        run: ./scripts/installer-test.ps1 (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName

      - name: Build test binary (opens a DevTools port for the smoke test)
        working-directory: src-tauri
        run: cargo build --release --features smoke-test,tauri/custom-protocol

      - name: Smoke test
        run: |
          npm install --no-save playwright-core@1
          node scripts/smoke-test.mjs src-tauri/target/release/awan.exe smoke

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke
          if-no-files-found: ignore
